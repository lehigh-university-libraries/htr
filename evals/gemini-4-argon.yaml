        I have not mutch news to wright to you though I fee as if it was my
        duty to send you a fiew lines sinc it has pleased the good & wise ruler
        of all things to Call our beloved Francis from the hard ships of this cruel
        war he was a good [soldier] & one that was bel[oved b]y all the company
        never heard a ma[n sp]eak of him in any [other w]ay than to say th[at]
        he was a perfect Gentle Man though he fell bravely & at his poast
        his loss was mutch regreted by all the company & we cimpatize with
        his friends whoes bonds of nature hold him dear to them
        & though we give him up we Still retain a hope that he
        is now high up in heaven I have had several relations
        In this wicked war & they have nearly all past away in this
        early day I had a brother & a Brother in law killed in Tennassee
        I have bin a witness to death in all its horrors since I have
        bin a Soldier in this troublesom war I have bin on the
        Battle field & have seen men fall on my right & left I have
        heard the prayers of the wounded & dying & heard them call
        for help & beg for water at mid nights g[lo]omy hours & even then
